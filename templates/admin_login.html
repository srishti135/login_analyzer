<!DOCTYPE html>
<html>

<head>
    <title>Admin Login</title>
</head>

<body>
    <h1>Admin Access</h1>
    <form method="POST" action="/admin_login">
        <label>Admin Password:</label>
        <input type="password" name="password">
        <br><br>
        <button type="submit">Enter</button>
    </form>
    {% if error %}
    <p style="color:red;">{{ error }}</p>
    {% endif %}
</body>

</html>
